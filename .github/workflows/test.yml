name: Test

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      # refer: https://v2.tauri.app/start/prerequisites/#linux
      - run: |
          sudo apt update
          sudo apt install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            fonts-noto-cjk \
            dbus-x11 \
            gnome-keyring
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      # The integration-tests crate prepares a shared llama.cpp runtime once
      # per `cargo test` invocation under `tests/integration-tests/.cache`;
      # caching that directory across runs avoids re-downloading the dylib
      # on every PR.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tests/integration-tests/.cache
          key: ${{ runner.os }}-integration-runtime-${{ hashFiles('koharu-runtime/**/*.rs', 'koharu-llm/**/*.rs') }}
          restore-keys: ${{ runner.os }}-integration-runtime-
      - name: DIAG bisect rpc lib suite (temporary, revert after diagnosis)
        continue-on-error: true
        run: |
          echo "=== budget six together ==="
          cargo test -p koharu-rpc --lib routes::pages::tests::page_import_budget 2>&1 | tail -4 || true
          echo "=== pages minus budget six ==="
          cargo test -p koharu-rpc --lib routes::pages:: -- --skip page_import_budget 2>&1 | tail -4 || true
      - name: Run workspace tests (unit + integration)
        run: |
          # Headless dbus + gnome-keyring so the provider-secret integration
          # tests can talk to secret-service on Linux runners.
          eval "$(dbus-launch --sh-syntax)"
          echo -n "" | gnome-keyring-daemon --unlock --components=secrets &>/dev/null &
          export $(echo -n "" | gnome-keyring-daemon --start --components=secrets 2>/dev/null)
          # --test-threads=1 avoids diagnostic lock contention between
          # tests that use lock_diagnostic_capture_test() and tests that
          # spawn threads interacting with diagnostics.
          cargo test --workspace --tests -- --test-threads=1
      - name: Test generated artifact checker
        run: bun run test:generated
      - name: Check generated artifacts
        run: bun run check:generated

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Run Vitest
        run: bun run --filter ui test
