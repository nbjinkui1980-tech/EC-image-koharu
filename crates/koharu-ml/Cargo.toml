[package]
name = "koharu-ml"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
authors.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
publish.workspace = true

[dependencies]
koharu-runtime = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
image = { workspace = true }
imageproc = { workspace = true }
ocrs-cjk = { workspace = true }
rten = { workspace = true }
candle-core = { workspace = true }
candle-transformers = { workspace = true }
candle-nn = { workspace = true }
candle-flash-attn = { workspace = true, optional = true }
tokenizers = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
rustfft = { workspace = true }
rayon = { workspace = true }
cudarc = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
objc2-metal-performance-shaders = { workspace = true, optional = true }
objc2-metal-performance-shaders-graph = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }

[features]
cuda = [
    "candle-core/cuda",
    "candle-core/cudnn",
    "candle-nn/cuda",
    "candle-nn/cudnn",
    "candle-transformers/cuda",
    "candle-transformers/cudnn",
    "cudarc",
    "candle-flash-attn",
    "candle-flash-attn/cudnn",
]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
    "objc2",
    "objc2-metal",
    "objc2-foundation",
    "objc2-metal-performance-shaders",
    "objc2-metal-performance-shaders-graph",
]
